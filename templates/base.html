<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PneumaticLab | Interactive Science</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- Mobile Header (Visible only on small screens) -->
    <div class="mobile-header d-md-none">
        <div class="d-flex align-items-center justify-content-between w-100">
            <h1 class="app-title m-0 fs-4">PNEUMATIC<span>LAB</span></h1>
            <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation">
                <i data-lucide="menu"></i>
            </button>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-box shadow">
                    <img src="{{ url_for('static', filename='images/logo ftkekk.jpg') }}" alt="Logo">
                </div>
                <h1 class="app-title">PNEUMATIC<span>LAB</span></h1>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <p class="section-title">Discovery</p>
                    <a href="/" class="nav-link" data-route="/">
                        <i data-lucide="home"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/system/modeling" class="nav-link" data-route="/system/modeling">
                        <i data-lucide="box"></i>
                        <span>System Basics</span>
                    </a>
                    <a href="/system/analysis" class="nav-link" data-route="/system/analysis">
                        <i data-lucide="activity"></i>
                        <span>Simulator Lab</span>
                    </a>
                </div>

                <div class="nav-section">
                    <p class="section-title">Control Theory</p>
                    <a href="/control/pid" class="nav-link" data-route="/control/pid">
                        <i data-lucide="cpu"></i>
                        <span>PID Control</span>
                    </a>
                    <a href="/control/state-space" class="nav-link" data-route="/control/state-space">
                        <i data-lucide="layers"></i>
                        <span>State Space</span>
                    </a>
                </div>

                <div class="nav-section">
                    <p class="section-title">Software Suite</p>
                    <a href="/simulink/modeling" class="nav-link" data-route="/simulink/modeling">
                        <i data-lucide="component"></i>
                        <span>Simulink</span>
                    </a>
                    <a href="/simulink/simscape" class="nav-link" data-route="/simulink/simscape">
                        <i data-lucide="wrench"></i>
                        <span>Simscape</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer text-center pb-4">
                <p class="m-0 xsmall text-light opacity-50 d-flex align-items-center justify-content-center gap-2">
                    <span class="fw-medium text-white opacity-75">PneumaticLab v2.0</span>
                </p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Active Route Logic
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('data-route') === currentPath) {
                link.classList.add('active');
            }
        });

        // Mobile Sidebar Toggle Logic
        const mobileBtn = document.getElementById('mobileToggleBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
            document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
        }

        if (mobileBtn && overlay) {
            mobileBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        }
    </script>
</body>

</html>
